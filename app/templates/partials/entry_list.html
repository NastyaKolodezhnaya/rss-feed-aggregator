{% if entries %}
<div class="space-y-2">
    {% for entry in entries %}
    <a href="/entries/detail/{{ entry.id }}" class="block bg-white rounded-lg border border-gray-200 p-4 hover:shadow-md transition-shadow">
        <h3 class="font-medium text-gray-900">{{ entry.title }}</h3>
        <p class="text-sm text-gray-500 mt-1">{{ entry.created_date.strftime('%b %d, %Y') }}</p>
    </a>
    {% endfor %}
</div>
{% else %}
<p class="text-gray-500 text-center py-8">No entries yet. Click Refresh to fetch new entries.</p>
{% endif %}
